# Actualiza cada día el mercado que muestra la app, sin intervención:
# descarga los anuncios, los procesa, reasigna los perfiles, corre las pruebas y sube el resultado a main.
# Render vuelve a desplegar al ver el push. Si algo falla, no se publica nada y la app sigue con el último mercado.
# La captura cruda (con direcciones) vive solo en la máquina temporal de GitHub y se borra al terminar.
name: Actualizar mercado diario

on:
  schedule:
    - cron: "0 12 * * *"   # 07:00 en Lima (UTC-5)
  workflow_dispatch:         # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-mercado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deliveries/week10/code/requirements-deploy.txt

      - name: Instalar dependencias
        run: pip install -r deliveries/week10/code/requirements-deploy.txt httpx==0.28.1

      - name: Descargar los anuncios del día
        run: python scraper/descarga_diaria.py --sin-historial

      - name: Preparar el mercado y reasignar los perfiles
        working-directory: deliveries/week10/code
        run: |
          python preparar_mercado.py
          python entrenar_perfil.py

      - name: Pruebas (preprocesamiento, búsqueda, fichas y cuentas)
        working-directory: deliveries/week10/code
        run: python -m unittest test_preprocesar test_cuentas_busqueda

      - name: Publicar el mercado nuevo
        run: |
          cd deliveries/week10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercado.csv data/mercado.json models/perfil_competitivo.joblib resultados/metricas_perfil.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el mercado."
          else
            git commit -m "chore(datos): actualizar el mercado con la captura del $(python -c "import json;print(json.load(open('data/mercado.json'))['captura'])")"
            git push
          fi
