<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DepaRent - Demo Week10</title>
  </head>
  <body>
    <h1>DepaRent - Demo Week10 (Flask)</h1>
    <p>Estimador de renta por distrito (estimación mediana del dataset).</p>

    <label for="distrito">Distrito:</label>
    <input id="distrito" placeholder="Escribe el nombre del distrito" />
    <button id="btn">Predecir</button>

    <pre id="output"></pre>

    <script>
      document.getElementById('btn').onclick = async () => {
        const distrito = document.getElementById('distrito').value;
        const resp = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ distrito })
        });
        const j = await resp.json();
        document.getElementById('output').textContent = JSON.stringify(j, null, 2);
      };
    </script>
  </body>
</html>
